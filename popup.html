<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    button {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 12px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      width: 100%;
      font-size: 14px;
    }
    button:hover {
      background-color: #e64a19;
    }
    p {
      font-size: 13px;
      color: #333;
      margin-top: 10px;
      line-height: 1.4;
      text-align: left;
    }
    /* 💡 権利表記用のスクロールエリア */
    .license-area {
      margin-top: 15px;
      padding: 8px;
      background-color: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 10px;
      color: #666;
      text-align: left;
      line-height: 1.3;
      max-height: 100px;
      overflow-y: auto; /* 文字が多い場合にスクロールバーを出す */
    }
  </style>
</head>
<body>
  <p id="status">ROのクエスト情報ページを開いた状態で、下のボタンを押すとデータ取得を開始します。</p>
  
  <button id="startBtn">保存を開始する</button>

</html>
